<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photobooth Web</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        :root {
            --bg-color: #F5F5F7;
            --primary: #000000;
            --on-primary: #FFFFFF;
            --text-secondary: #777777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--primary);
        }

        .screen {
            display: none;
            height: 100vh;
            padding: 16px 24px;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 8px 0;
        }

        h2 {
            margin: 0 0 16px 0;
        }

        p {
            color: var(--text-secondary);
            margin: 0 0 24px 0;
        }

        .bottom-actions {
            margin-top: auto;
            padding-top: 16px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary);
            color: var(--on-primary);

            border: none;
            border-radius: 30px;

            padding: 12px 20px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                opacity 0.2s,
                transform 0.15s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        /* =====================================================
           INPUT NAMA
        ===================================================== */

        .name-container {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
        }

        .name-box {
            width: min(600px, 90vw);

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .name-box h1 {
            margin-bottom: 10px;
        }

        .name-box p {
            margin-bottom: 25px;
        }

        #guest-name {
            width: 100%;

            padding: 16px 20px;

            border: 2px solid #ddd;

            border-radius: 14px;

            outline: none;

            font-size: 18px;

            text-align: center;

            transition:
                border-color 0.2s;
        }

        #guest-name:focus {
            border-color: #000;
        }

        .name-preview {
            margin-top: 15px;

            font-size: 12px;

            color: #777;
        }

        .name-preview strong {
            color: #000;
        }

        /* =====================================================
           PILIH FRAME
        ===================================================== */

        .frame-grid {
            display: flex;

            align-items: center;

            gap: 40px;

            flex: 1;

            width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            padding: 30px 12vw;

            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .frame-grid::-webkit-scrollbar {
            display: none;
        }

        .frame-item {
            flex: 0 0 auto;

            width: min(390px, 32vw);

            height: min(560px, 50vh);

            background-color: #ddd;

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            border-radius: 16px;

            cursor: pointer;

            border: 3px solid transparent;

            position: relative;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .frame-item:hover {
            transform: scale(1.02);
        }

        .frame-item.selected {
            border-color: #000;

            transform: scale(1.05);

            box-shadow: none;
        }

        .frame-item.selected::after {
            content: "✓";

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size: 70px;

            font-weight: 700;

            line-height: 1;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.35);

            pointer-events: none;

            z-index: 100;
        }

        /* =====================================================
           CAMERA
        ===================================================== */

        .camera-container {
            display: flex;

            gap: 20px;

            flex: 1;

            min-height: 0;
        }

        .video-wrapper {
            flex: 3;

            background: #000;

            border-radius: 16px;

            overflow: hidden;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 0;
        }

        #camera-feed {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            background: #000;
        }

        /* =====================================================
           COUNTDOWN
        ===================================================== */

        .countdown {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 80px;

            color: white;

            font-weight: bold;

            text-shadow:
                2px 2px 10px rgba(0, 0, 0, 0.5);

            z-index: 100;
        }

        .flash {
            position: absolute;

            inset: 0;

            background: white;

            opacity: 0;

            pointer-events: none;

            z-index: 200;
        }

        .flash.active {
            opacity: 0.8;

            transition:
                opacity 0.1s;
        }

        /* =====================================================
           PREVIEW FRAME DI SAMPING KAMERA
        ===================================================== */

        .preview-wrapper {
            flex: 2;

            background: #dcdcdc;

            border-radius: 16px;

            padding: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 0;

            overflow: hidden;
        }

        .frame-preview-container {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }

        #camera-side-frame {
            position: absolute;

            display: block;

            object-fit: fill;

            pointer-events: none;

            z-index: 30;
        }

        #photo-slots {
            position: absolute;

            z-index: 10;

            pointer-events: none;
        }

        /* =====================================================
           SLOT FOTO
        ===================================================== */

        .photo-slot {
            position: absolute;

            overflow: hidden;

            cursor: pointer;

            pointer-events: auto;

            border-radius: 2px;

            transition:
                transform 0.15s,
                outline 0.15s;

            z-index: 20;
        }

        .photo-slot:hover {
            transform: scale(1.015);

            outline:
                2px solid white;

            z-index: 60;
        }

        .photo-slot canvas {
            width: 100%;
            height: 100%;

            display: block;
        }

        .slot-number {
            position: absolute;

            top: 5px;
            left: 5px;

            width: 25px;
            height: 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 11px;

            font-weight: bold;

            z-index: 70;

            pointer-events: none;
        }

        .slot-empty {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            color: white;

            font-size: 11px;

            font-weight: bold;

            background:
                rgba(0, 0, 0, 0.35);

            z-index: 30;

            pointer-events: none;
        }

        .retake-label {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.55);

            color: white;

            font-size: 12px;

            font-weight: bold;

            opacity: 0;

            transition:
                opacity 0.15s;

            z-index: 80;

            pointer-events: none;
        }

        .photo-slot:hover .retake-label {
            opacity: 1;
        }

        /* =====================================================
           PREVIEW EDIT
        ===================================================== */

        .editor-container {
            display: flex;

            gap: 16px;

            flex: 1;

            min-height: 0;
        }

        .canvas-area {
            flex: 3;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #e0e0e0;

            border-radius: 10px;

            min-height: 0;

            padding: 10px;

            position: relative;
        }

        canvas {
            max-width: 100%;

            max-height: 100%;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .tools-area {
            flex: 2;

            background: white;

            border-radius: 10px;

            padding: 15px;

            overflow-y: auto;
        }

        /* =====================================================
           RESULT
        ===================================================== */

        .result-container {
            display: flex;

            gap: 20px;

            flex: 1;

            min-height: 0;

            align-items: center;
        }

        .result-left {
            flex: 1;

            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #e0e0e0;

            border-radius: 12px;
        }

        .result-right {
            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: white;

            padding: 20px;

            border-radius: 12px;

            height: 100%;

            text-align: center;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        #loading-overlay {
            display: none;

            position: absolute;

            inset: 0;

            background:
                rgba(255, 255, 255, 0.8);

            z-index: 10;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            border-radius: 10px;
        }

        .spinner {
            border:
                4px solid #f3f3f3;

            border-top:
                4px solid #000;

            border-radius: 50%;

            width: 40px;
            height: 40px;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .frame-item {
                width: 260px;
                height: 390px;
            }

            .frame-grid {
                padding: 25px 40px;
                gap: 25px;
            }

            .camera-container {
                flex-direction: column;
            }

            .video-wrapper {
                min-height: 50vh;
            }

            .preview-wrapper {
                min-height: 30vh;
            }

            .editor-container,
            .result-container {
                flex-direction: column;
            }

            .name-box {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div
    id="start-screen"
    class="screen active"
>

    <div
        style="
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        "
    >

        <h1>
            Photobooth
        </h1>

        <p>
            Capture your moments beautifully
        </p>

    </div>

    <div class="bottom-actions">

        <button
            onclick="nav('name-screen')"
        >
            Mulai Sesi
        </button>

    </div>

</div>


<!-- =====================================================
     INPUT NAMA SCREEN
===================================================== -->

<div
    id="name-screen"
    class="screen"
>

    <div class="name-container">

        <div class="name-box">

            <h1>
                Siapa Nama Anda?
            </h1>

            <p>
                Masukkan nama sebelum memulai sesi foto.
            </p>

            <input
                type="text"
                id="guest-name"
                placeholder="Contoh: Budi Otomo"
                maxlength="50"
                autocomplete="off"
            >

            <div class="name-preview">

                Nama folder:

                <strong id="folder-preview">
                    -
                </strong>

            </div>

        </div>

    </div>

    <div class="bottom-actions">

        <button
            class="outline"
            onclick="nav('start-screen')"
        >
            Kembali
        </button>

        <button
            id="btn-name-continue"
            onclick="continueToFrame()"
        >
            Lanjut Pilih Frame
        </button>

    </div>

</div>


<!-- =====================================================
     FRAME SCREEN
===================================================== -->

<div
    id="frame-screen"
    class="screen"
>

    <h2>
        Pilih Frame
    </h2>

    <div
        class="frame-grid"
        id="frame-list"
    >

        <div
            class="frame-item"

            style="
                background-image:
                url('frame/default.png');

                background-size:cover;
                background-position:center;
            "

            onclick="
                selectFrame(
                    this,
                    'frame/default.png'
                )
            "
        ></div>

    </div>

    <div class="bottom-actions">

        <button
            class="outline"
            onclick="nav('name-screen')"
        >
            Kembali
        </button>

        <button
            id="btn-continue-camera"
            disabled

            onclick="
                nav('camera-screen');
                initCamera();
            "
        >
            Pilih Frame Dulu
        </button>

    </div>

</div>


<!-- =====================================================
     CAMERA SCREEN
===================================================== -->

<div
    id="camera-screen"
    class="screen"
>

    <div
        style="
            display:flex;
            justify-content:space-between;
            margin-bottom:12px;
            align-items:center;
        "
    >

        <h2 style="margin:0;">

            Kamera

            <span
                id="camera-name-display"
                style="
                    font-size:13px;
                    color:#777;
                    font-weight:normal;
                    margin-left:8px;
                "
            ></span>

        </h2>

        <button
            class="outline"

            style="
                width:auto;
                padding:6px 12px;
                font-size:12px;
                margin:0;
            "

            onclick="toggleMirror()"
        >
            Balik Kamera
        </button>

    </div>

    <div class="camera-container">

        <!-- KAMERA LIVE -->

        <div
            class="video-wrapper"
            id="video-wrapper"
        >

            <video
                id="camera-feed"
                autoplay
                playsinline
            ></video>

            <div
                id="countdown"
                class="countdown"
            ></div>

            <div
                id="flash"
                class="flash"
            ></div>

        </div>

        <!-- FRAME + HASIL FOTO -->

        <div class="preview-wrapper">

            <div
                class="frame-preview-container"
                id="frame-preview-container"
            >

                <!-- SLOT FOTO -->

                <div
                    id="photo-slots"
                ></div>

                <!-- FRAME ASLI -->

                <img
                    id="camera-side-frame"
                    src=""
                    alt="Frame"
                >

            </div>

        </div>

    </div>

    <div class="bottom-actions">

        <button
            id="btn-take"
            onclick="takePhotos()"
        >
            Ambil Foto
        </button>

        <button
            id="btn-next-preview"
            disabled

            onclick="
                nav('preview-screen');
                loadPreview();
            "
        >
            Lanjutkan
        </button>

    </div>

</div>


<!-- =====================================================
     PREVIEW SCREEN
===================================================== -->

<div
    id="preview-screen"
    class="screen"
>

    <h2>
        Preview & Edit
    </h2>

    <div class="editor-container">

        <div class="canvas-area">

            <canvas
                id="result-canvas"
            ></canvas>

            <div id="loading-overlay">

                <div class="spinner"></div>

                <p
                    style="
                        margin-top:10px;
                        font-weight:bold;
                    "
                >
                    Memproses...
                </p>

            </div>

        </div>

        <div class="tools-area">

            <h3 style="margin-top:0;">
                Informasi Sesi
            </h3>

            <div
                style="
                    background:#f5f5f5;
                    padding:12px;
                    border-radius:10px;
                    margin-bottom:20px;
                    font-size:13px;
                "
            >

                <div>
                    Nama:
                    <strong id="preview-name">
                        -
                    </strong>
                </div>

                <div style="margin-top:5px;">
                    Folder:
                    <strong id="preview-folder">
                        -
                    </strong>
                </div>

            </div>

            <h3>
                Filter Warna
            </h3>

            <div
                style="
                    display:flex;
                    flex-direction:column;
                    gap:8px;
                    margin-bottom:20px;
                "
            >

                <button
                    class="outline"
                    onclick="
                        applyFilter('none')
                    "
                >
                    Original
                </button>

                <button
                    class="outline"
                    onclick="
                        applyFilter(
                            'grayscale(100%)'
                        )
                    "
                >
                    Hitam Putih
                </button>

                <button
                    class="outline"
                    onclick="
                        applyFilter(
                            'sepia(100%)'
                        )
                    "
                >
                    Retro / Sepia
                </button>

            </div>

        </div>

    </div>

    <div class="bottom-actions">

        <button
            onclick="
                processAndUploadSession()
            "
        >
            Selesai & Proses Otomatis
        </button>

    </div>

</div>


<!-- =====================================================
     RESULT SCREEN
===================================================== -->

<div
    id="result-screen"
    class="screen"
>

    <h2>
        Sesi Selesai
    </h2>

    <div class="result-container">

        <div class="result-left">

            <canvas
                id="final-preview-canvas"
                style="
                    max-height:100%;
                    border-radius:8px;
                "
            ></canvas>

        </div>

        <div class="result-right">

            <h3 style="margin-top:0;">

                <span id="result-name">
                    Foto
                </span>

            </h3>

            <p>
                Scan untuk unduh foto
            </p>

            <div
                id="qrcode-container"
                style="margin:10px 0;"
            >

                <div
                    class="spinner"
                    style="
                        margin:20px auto;
                    "
                ></div>

            </div>

            <p
                id="qr-status-text"
                style="
                    font-size:11px;
                    color:#666;
                    margin-bottom:15px;
                "
            >
                Loading...
            </p>

            <div
                style="
                    display:flex;
                    flex-direction:column;
                    gap:8px;
                    width:100%;
                "
            >

                <button
                    onclick="downloadImage()"
                >
                    ⬇️ Unduh Foto Frame
                </button>

                <button
                    class="outline"
                    onclick="downloadTanpaFrame()"
                >
                    🖼️ Unduh Foto Satuan
                </button>

                <button
                    class="outline"
                    onclick="location.reload()"

                    style="
                        background-color:#ffebeb;
                        color:red;
                        border-color:red;
                    "
                >
                    🔄 Sesi Baru
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   NAVIGATION
===================================================== */

function nav(screenId) {

    document
        .querySelectorAll('.screen')
        .forEach(
            screen => {

                screen.classList.remove(
                    'active'
                );

            }
        );

    const target =
        document.getElementById(
            screenId
        );

    if (target) {

        target.classList.add(
            'active'
        );

    }

}


/* =====================================================
   VARIABLES
===================================================== */

let requiredPhotos = 0;

let selectedFramePath = '';

let frameHoles = [];

let stream = null;

let isMirrored = true;

let capturedImages = [];

let finalFrameImageObj = null;

let currentCanvasFilter = 'none';

let isTakingPhoto = false;


/*
 * DATA NAMA SESI
 */

let sessionName = '';

let sessionFolderName = '';

let sessionFilePrefix = '';


/* =====================================================
   FORMAT NAMA
===================================================== */

/*
 * Membersihkan nama agar aman digunakan
 * sebagai nama folder/file.
 */

function sanitizeName(name) {

    return name
        .trim()
        .replace(/[<>:"/\\|?*]+/g, '')
        .replace(/\s+/g, '_')
        .replace(/_+/g, '_');

}


/*
 * Nama bulan Indonesia.
 */

function getIndonesianMonth(month) {

    const months = [
        'Januari',
        'Februari',
        'Maret',
        'April',
        'Mei',
        'Juni',
        'Juli',
        'Agustus',
        'September',
        'Oktober',
        'November',
        'Desember'
    ];

    return months[month];

}


/*
 * Membuat nama folder.
 *
 * Contoh:
 *
 * Budi_Otomo_14_Agustus_2026
 */

function createFolderName(name) {

    const now = new Date();

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            '0'
        );

    const month =
        getIndonesianMonth(
            now.getMonth()
        );

    const year =
        now.getFullYear();

    return (
        sanitizeName(name) +
        '_' +
        day +
        '_' +
        month +
        '_' +
        year
    );

}


/*
 * Prefix nama file.
 *
 * Contoh:
 *
 * Budi_Otomo
 */

function createFilePrefix(name) {

    return sanitizeName(name);

}


/* =====================================================
   CONTINUE INPUT NAMA
===================================================== */

function continueToFrame() {

    const input =
        document.getElementById(
            'guest-name'
        );

    const name =
        input.value.trim();

    if (!name) {

        alert(
            'Silakan masukkan nama terlebih dahulu.'
        );

        input.focus();

        return;

    }


    sessionName = name;

    sessionFolderName =
        createFolderName(
            sessionName
        );

    sessionFilePrefix =
        createFilePrefix(
            sessionName
        );


    /*
     * Update preview.
     */

    document
        .getElementById(
            'folder-preview'
        )
        .innerText =
        sessionFolderName;


    document
        .getElementById(
            'preview-name'
        )
        .innerText =
        sessionName;


    document
        .getElementById(
            'preview-folder'
        )
        .innerText =
        sessionFolderName;


    document
        .getElementById(
            'camera-name-display'
        )
        .innerText =
        `• ${sessionName}`;


    document
        .getElementById(
            'result-name'
        )
        .innerText =
        sessionName;


    nav(
        'frame-screen'
    );

}


/* =====================================================
   INPUT NAMA PREVIEW REALTIME
===================================================== */

document
    .getElementById(
        'guest-name'
    )
    .addEventListener(
        'input',
        function() {

            const name =
                this.value.trim();

            const preview =
                document.getElementById(
                    'folder-preview'
                );

            if (!name) {

                preview.innerText =
                    '-';

                return;

            }

            preview.innerText =
                createFolderName(
                    name
                );

        }
    );


/*
 * Enter = lanjut.
 */

document
    .getElementById(
        'guest-name'
    )
    .addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter'
            ) {

                continueToFrame();

            }

        }
    );


/* =====================================================
   DETECT TRANSPARENT FRAME HOLES
===================================================== */

async function detectFrameHoles(
    imgSrc
) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload = () => {

                finalFrameImageObj =
                    img;

                const canvas =
                    document.createElement(
                        'canvas'
                    );

                const ctx =
                    canvas.getContext(
                        '2d',
                        {
                            willReadFrequently:
                                true
                        }
                    );

                const width =
                    img.width;

                const height =
                    img.height;

                canvas.width =
                    width;

                canvas.height =
                    height;

                ctx.drawImage(
                    img,
                    0,
                    0
                );

                const imageData =
                    ctx.getImageData(
                        0,
                        0,
                        width,
                        height
                    );

                const data =
                    imageData.data;

                const visited =
                    new Uint8Array(
                        width * height
                    );

                const holes = [];

                for (
                    let y = 0;
                    y < height;
                    y++
                ) {

                    for (
                        let x = 0;
                        x < width;
                        x++
                    ) {

                        const index =
                            y * width + x;

                        if (
                            data[
                                index * 4 + 3
                            ] < 10 &&
                            visited[index] === 0
                        ) {

                            let minX = x;
                            let maxX = x;

                            let minY = y;
                            let maxY = y;

                            const stack =
                                [index];

                            while (
                                stack.length > 0
                            ) {

                                const idx =
                                    stack.pop();

                                if (
                                    visited[idx]
                                ) {
                                    continue;
                                }

                                const px =
                                    idx % width;

                                const py =
                                    Math.floor(
                                        idx / width
                                    );

                                if (
                                    data[
                                        idx * 4 + 3
                                    ] >= 10
                                ) {
                                    continue;
                                }

                                visited[idx] =
                                    1;

                                if (
                                    px < minX
                                ) {
                                    minX = px;
                                }

                                if (
                                    px > maxX
                                ) {
                                    maxX = px;
                                }

                                if (
                                    py < minY
                                ) {
                                    minY = py;
                                }

                                if (
                                    py > maxY
                                ) {
                                    maxY = py;
                                }

                                if (
                                    px + 1 < width
                                ) {
                                    stack.push(
                                        idx + 1
                                    );
                                }

                                if (
                                    px - 1 >= 0
                                ) {
                                    stack.push(
                                        idx - 1
                                    );
                                }

                                if (
                                    py + 1 < height
                                ) {
                                    stack.push(
                                        idx + width
                                    );
                                }

                                if (
                                    py - 1 >= 0
                                ) {
                                    stack.push(
                                        idx - width
                                    );
                                }

                            }

                            if (
                                maxX - minX > 80 &&
                                maxY - minY > 80
                            ) {

                                holes.push({

                                    x: minX,

                                    y: minY,

                                    w:
                                        maxX -
                                        minX,

                                    h:
                                        maxY -
                                        minY

                                });

                            }

                        }

                    }

                }

                holes.sort(
                    (a, b) => {

                        if (
                            Math.abs(
                                a.y - b.y
                            ) < 20
                        ) {

                            return (
                                a.x - b.x
                            );

                        }

                        return (
                            a.y - b.y
                        );

                    }
                );

                resolve(
                    holes
                );

            };

            img.onerror = () => {

                reject(
                    'Gambar frame tidak ditemukan.'
                );

            };

            img.src =
                imgSrc;

        }
    );

}


/* =====================================================
   SELECT FRAME
===================================================== */

async function selectFrame(
    element,
    framePath
) {

    document
        .querySelectorAll(
            '.frame-item'
        )
        .forEach(
            frame => {

                frame.classList.remove(
                    'selected'
                );

            }
        );

    element.classList.add(
        'selected'
    );

    selectedFramePath =
        framePath;

    const button =
        document.getElementById(
            'btn-continue-camera'
        );

    button.disabled =
        true;

    button.innerText =
        'Memindai Frame...';

    try {

        frameHoles =
            await detectFrameHoles(
                framePath
            );

        requiredPhotos =
            frameHoles.length;

        if (
            requiredPhotos === 0
        ) {

            button.disabled =
                true;

            button.innerText =
                'Pilih Frame Dulu';

            alert(
                'Frame tidak mempunyai lubang transparan.'
            );

            return;

        }

        button.disabled =
            false;

        button.innerText =
            `Lanjut (${requiredPhotos} Foto)`;

    } catch(error) {

        console.error(
            error
        );

        alert(
            error
        );

    }

}


/* =====================================================
   INIT CAMERA
===================================================== */

async function initCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => {
                        track.stop();
                    }
                );

        }

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            'user',

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    }

                });

        const video =
            document.getElementById(
                'camera-feed'
            );

        video.srcObject =
            stream;

        capturedImages =
            new Array(
                requiredPhotos
            );

        document
            .getElementById(
                'btn-take'
            )
            .disabled = false;

        document
            .getElementById(
                'btn-next-preview'
            )
            .disabled = true;

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadedmetadata =
                        () => {
                            resolve();
                        };

                }

            }
        );

        buildFramePreview();

    } catch(error) {

        console.error(
            error
        );

        alert(
            'Izin kamera diperlukan.'
        );

    }

}


/* =====================================================
   BUILD FRAME PREVIEW
===================================================== */

function buildFramePreview() {

    if (
        !finalFrameImageObj
    ) {
        return;
    }

    const container =
        document.getElementById(
            'frame-preview-container'
        );

    const frame =
        document.getElementById(
            'camera-side-frame'
        );

    const slots =
        document.getElementById(
            'photo-slots'
        );

    const containerWidth =
        container.clientWidth;

    const containerHeight =
        container.clientHeight;

    const frameWidth =
        finalFrameImageObj.width;

    const frameHeight =
        finalFrameImageObj.height;

    const frameRatio =
        frameWidth /
        frameHeight;

    let displayWidth =
        containerWidth;

    let displayHeight =
        displayWidth /
        frameRatio;

    if (
        displayHeight >
        containerHeight
    ) {

        displayHeight =
            containerHeight;

        displayWidth =
            displayHeight *
            frameRatio;

    }

    const offsetX =
        (
            containerWidth -
            displayWidth
        ) / 2;

    const offsetY =
        (
            containerHeight -
            displayHeight
        ) / 2;

    frame.src =
        selectedFramePath;

    frame.style.width =
        displayWidth + 'px';

    frame.style.height =
        displayHeight + 'px';

    frame.style.left =
        offsetX + 'px';

    frame.style.top =
        offsetY + 'px';

    slots.style.left =
        offsetX + 'px';

    slots.style.top =
        offsetY + 'px';

    slots.style.width =
        displayWidth + 'px';

    slots.style.height =
        displayHeight + 'px';

    slots.innerHTML =
        '';

    frameHoles.forEach(
        (
            hole,
            index
        ) => {

            const slot =
                document.createElement(
                    'div'
                );

            slot.className =
                'photo-slot';

            slot.style.left =
                (
                    hole.x /
                    frameWidth *
                    displayWidth
                ) + 'px';

            slot.style.top =
                (
                    hole.y /
                    frameHeight *
                    displayHeight
                ) + 'px';

            slot.style.width =
                (
                    hole.w /
                    frameWidth *
                    displayWidth
                ) + 'px';

            slot.style.height =
                (
                    hole.h /
                    frameHeight *
                    displayHeight
                ) + 'px';

            slot.dataset.index =
                index;

            const canvas =
                document.createElement(
                    'canvas'
                );

            canvas.width =
                hole.w;

            canvas.height =
                hole.h;

            slot.appendChild(
                canvas
            );

            const number =
                document.createElement(
                    'div'
                );

            number.className =
                'slot-number';

            number.innerText =
                index + 1;

            slot.appendChild(
                number
            );

            const empty =
                document.createElement(
                    'div'
                );

            empty.className =
                'slot-empty';

            empty.innerHTML =
                `Foto ${index + 1}`;

            slot.appendChild(
                empty
            );

            const retake =
                document.createElement(
                    'div'
                );

            retake.className =
                'retake-label';

            retake.innerHTML =
                '↻ Ambil Ulang';

            slot.appendChild(
                retake
            );

            slot.addEventListener(
                'click',
                () => {

                    if (
                        capturedImages[index]
                    ) {

                        retakePhoto(
                            index
                        );

                    }

                }
            );

            slots.appendChild(
                slot
            );

            renderSlot(
                index
            );

        }
    );

}


/* =====================================================
   RENDER SLOT
===================================================== */

function renderSlot(index) {

    const slots =
        document.querySelectorAll(
            '.photo-slot'
        );

    const slot =
        slots[index];

    if (!slot) {
        return;
    }

    const canvas =
        slot.querySelector(
            'canvas'
        );

    const ctx =
        canvas.getContext(
            '2d'
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const empty =
        slot.querySelector(
            '.slot-empty'
        );

    if (
        !capturedImages[index]
    ) {

        ctx.fillStyle =
            '#222';

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if (empty) {

            empty.style.display =
                'flex';

        }

        return;

    }

    if (empty) {

        empty.style.display =
            'none';

    }

    const image =
        new Image();

    image.onload =
        () => {

            drawImageIntoHole(

                ctx,

                image,

                {
                    x: 0,
                    y: 0,
                    w: canvas.width,
                    h: canvas.height
                }

            );

        };

    image.src =
        capturedImages[index];

}


/* =====================================================
   FIT FOTO KE LUBANG
===================================================== */

function drawImageIntoHole(
    ctx,
    image,
    target
) {

    const imageRatio =
        image.width /
        image.height;

    const targetRatio =
        target.w /
        target.h;

    let sourceWidth =
        image.width;

    let sourceHeight =
        image.height;

    let sourceX = 0;

    let sourceY = 0;

    if (
        imageRatio >
        targetRatio
    ) {

        sourceWidth =
            image.height *
            targetRatio;

        sourceX =
            (
                image.width -
                sourceWidth
            ) / 2;

    } else {

        sourceHeight =
            image.width /
            targetRatio;

        sourceY =
            (
                image.height -
                sourceHeight
            ) / 2;

    }

    ctx.drawImage(

        image,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        target.x,
        target.y,

        target.w,
        target.h

    );

}


/* =====================================================
   TOGGLE MIRROR
===================================================== */

function toggleMirror() {

    isMirrored =
        !isMirrored;

    document
        .getElementById(
            'camera-feed'
        )
        .style.transform =

        isMirrored
            ? 'scaleX(-1)'
            : 'scaleX(1)';

}


/* =====================================================
   TAKE ALL PHOTOS
===================================================== */

async function takePhotos() {

    if (
        isTakingPhoto
    ) {
        return;
    }

    isTakingPhoto =
        true;

    document
        .getElementById(
            'btn-take'
        )
        .disabled = true;

    for (
        let i = 0;
        i < requiredPhotos;
        i++
    ) {

        await runCountdown();

        captureFrame(
            i
        );

    }

    isTakingPhoto =
        false;

    document
        .getElementById(
            'btn-take'
        )
        .disabled = false;

    document
        .getElementById(
            'btn-next-preview'
        )
        .disabled = false;

}


/* =====================================================
   RETAKE SATU SLOT
===================================================== */

async function retakePhoto(
    index
) {

    if (
        isTakingPhoto ||
        !stream
    ) {
        return;
    }

    isTakingPhoto =
        true;

    const slots =
        document.querySelectorAll(
            '.photo-slot'
        );

    slots.forEach(
        slot => {

            slot.style.pointerEvents =
                'none';

        }
    );

    await runCountdown();

    captureFrame(
        index
    );

    slots.forEach(
        slot => {

            slot.style.pointerEvents =
                'auto';

        }
    );

    isTakingPhoto =
        false;

    document
        .getElementById(
            'btn-next-preview'
        )
        .disabled = false;

}


/* =====================================================
   COUNTDOWN
===================================================== */

function runCountdown() {

    return new Promise(
        resolve => {

            let count = 3;

            const countdown =
                document.getElementById(
                    'countdown'
                );

            countdown.innerText =
                count;

            const interval =
                setInterval(
                    () => {

                        count--;

                        if (
                            count > 0
                        ) {

                            countdown.innerText =
                                count;

                        } else {

                            clearInterval(
                                interval
                            );

                            countdown.innerText =
                                '';

                            const flash =
                                document.getElementById(
                                    'flash'
                                );

                            flash.classList.add(
                                'active'
                            );

                            setTimeout(
                                () => {

                                    flash.classList.remove(
                                        'active'
                                    );

                                },
                                120
                            );

                            resolve();

                        }

                    },
                    700
                );

        }
    );

}


/* =====================================================
   CAPTURE FRAME
===================================================== */

function captureFrame(
    index
) {

    const video =
        document.getElementById(
            'camera-feed'
        );

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }

    const canvas =
        document.createElement(
            'canvas'
        );

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext(
            '2d'
        );

    if (
        isMirrored
    ) {

        ctx.translate(
            canvas.width,
            0
        );

        ctx.scale(
            -1,
            1
        );

    }

    ctx.drawImage(
        video,
        0,
        0
    );

    capturedImages[index] =
        canvas.toDataURL(
            'image/jpeg',
            0.92
        );

    renderSlot(
        index
    );

}


/* =====================================================
   LOAD PREVIEW
===================================================== */

function loadPreview() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );

        stream =
            null;

    }

    drawCanvas(
        true,
        'result-canvas'
    );

}


/* =====================================================
   APPLY FILTER
===================================================== */

function applyFilter(
    filterCss
) {

    currentCanvasFilter =
        filterCss;

    drawCanvas(
        true,
        'result-canvas'
    );

}


/* =====================================================
   DRAW FINAL CANVAS
===================================================== */

async function drawCanvas(
    withFrame = true,
    canvasId = 'result-canvas'
) {

    if (
        !finalFrameImageObj
    ) {

        return;

    }

    const canvas =
        document.getElementById(
            canvasId
        );

    const ctx =
        canvas.getContext(
            '2d'
        );

    canvas.width =
        finalFrameImageObj.width;

    canvas.height =
        finalFrameImageObj.height;

    ctx.fillStyle =
        '#FFFFFF';

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.filter =
        currentCanvasFilter;

    const photoPromises =
        capturedImages.map(
            (
                source,
                index
            ) => {

                return new Promise(
                    resolve => {

                        if (
                            !source
                        ) {

                            resolve();

                            return;

                        }

                        const image =
                            new Image();

                        image.onload =
                            () => {

                                const hole =
                                    frameHoles[
                                        index
                                    ];

                                if (
                                    hole
                                ) {

                                    drawImageIntoHole(

                                        ctx,

                                        image,

                                        hole

                                    );

                                }

                                resolve();

                            };

                        image.src =
                            source;

                    }
                );

            }
        );

    await Promise.all(
        photoPromises
    );

    if (
        withFrame
    ) {

        ctx.filter =
            'none';

        ctx.drawImage(

            finalFrameImageObj,

            0,
            0,

            canvas.width,
            canvas.height

        );

    }

}


/* =====================================================
   DOWNLOAD FRAME
===================================================== */

function downloadImage() {

    const link =
        document.createElement(
            'a'
        );

    link.download =
        `${sessionFilePrefix}_Foto_Frame.png`;

    link.href =
        document
            .getElementById(
                'result-canvas'
            )
            .toDataURL(
                'image/png'
            );

    link.click();

}


/* =====================================================
   DOWNLOAD FOTO SATUAN
===================================================== */

function downloadTanpaFrame() {

    capturedImages.forEach(
        (
            image,
            index
        ) => {

            if (
                !image
            ) {

                return;

            }

            const link =
                document.createElement(
                    'a'
                );

            link.download =
                `${sessionFilePrefix}_Foto_${index + 1}.jpg`;

            link.href =
                image;

            link.click();

        }
    );

}


/* =====================================================
   PROCESS + UPLOAD
===================================================== */

async function processAndUploadSession() {

    /*
     * Pastikan nama tersedia.
     */

    if (
        !sessionName
    ) {

        alert(
            'Nama sesi belum diisi.'
        );

        nav(
            'name-screen'
        );

        return;

    }


    nav(
        'result-screen'
    );


    /*
     * Preview final.
     */

    await drawCanvas(
        true,
        'final-preview-canvas'
    );


    /*
     * Buat hasil utama.
     */

    await drawCanvas(
        true,
        'result-canvas'
    );


    const frameImageData =
        document
            .getElementById(
                'result-canvas'
            )
            .toDataURL(
                'image/png'
            );


    /*
     * Buat GIF.
     */

    gifshot.createGIF(

        {

            images: [
                ...capturedImages,
                frameImageData
            ],

            interval: 0.6,

            gifWidth: 600,

            gifHeight:
                Math.floor(
                    600 *
                    (
                        finalFrameImageObj.height /
                        finalFrameImageObj.width
                    )
                ),

            numFrames:
                capturedImages.length + 1

        },

        async function(obj) {

            let gifData =
                '';

            if (
                !obj.error
            ) {

                gifData =
                    obj.image;

            }

            try {

                /*
                 * Upload ke server.
                 *
                 * TAMBAHAN:
                 *
                 * sessionName
                 * folderName
                 * fileNamePrefix
                 */

                const response =
                    await fetch(
                        '/upload-session',
                        {

                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({

                                    /*
                                     * DATA NAMA
                                     */

                                    sessionName:
                                        sessionName,

                                    folderName:
                                        sessionFolderName,

                                    fileNamePrefix:
                                        sessionFilePrefix,

                                    /*
                                     * DATA FOTO
                                     */

                                    frameImage:
                                        frameImageData,

                                    individualImages:
                                        capturedImages,

                                    gifImage:
                                        gifData

                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success
                ) {

                    const qrContainer =
                        document.getElementById(
                            'qrcode-container'
                        );

                    qrContainer.innerHTML =
                        '';


                    new QRCode(
                        qrContainer,
                        {

                            text:
                                result.folder_link,

                            width:
                                170,

                            height:
                                170,

                            colorDark:
                                '#000000',

                            colorLight:
                                '#ffffff',

                            correctLevel:
                                QRCode
                                    .CorrectLevel
                                    .H

                        }
                    );


                    document
                        .getElementById(
                            'qr-status-text'
                        )
                        .innerText =
                        `Folder ${sessionFolderName} siap diunduh.`;

                } else {

                    alert(
                        'Gagal membuat folder di Drive.'
                    );

                }


            } catch(error) {

                console.error(
                    'Error:',
                    error
                );

                alert(
                    'Gagal menghubungi server Node.js.'
                );

            }

        }

    );

}


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    'resize',
    () => {

        const cameraScreen =
            document.getElementById(
                'camera-screen'
            );

        if (
            cameraScreen.classList.contains(
                'active'
            )
        ) {

            buildFramePreview();

        }

    }
);
