<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Web</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #F5F5F7;
            --primary: #000000;
            --on-primary: #FFFFFF;
            --text-secondary: #777777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
        }

        .screen {
            display: none;
            height: 100vh;
            padding: 16px 24px;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 8px;
        }

        h2 {
            margin: 0 0 16px;
        }

        p {
            color: var(--text-secondary);
            margin: 0 0 24px;
        }

        .bottom-actions {
            margin-top: auto;
            padding-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s, transform .15s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button.outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }


        /* =====================================================
           PILIH FRAME
        ===================================================== */

        #frame-screen {
            overflow: hidden;
        }

        .frame-grid {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 30px 50px;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .frame-grid::-webkit-scrollbar {
            display: none;
        }

        .frame-item {
            flex: 0 0 180px;
            height: 260px;

            background-color: #ddd;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

            border-radius: 12px;
            cursor: pointer;

            border: 3px solid transparent;
            position: relative;

            transition:
                transform .2s ease,
                border-color .2s ease;
        }

        .frame-item:hover {
            transform: scale(1.02);
        }

        .frame-item.selected {
            border-color: #000;
            transform: scale(1.05);
            box-shadow: none;
        }

        .frame-item.selected::after {
            content: "✓";

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;
            font-size: 52px;
            font-weight: 700;

            line-height: 1;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, .6),
                0 0 8px rgba(0, 0, 0, .4);

            pointer-events: none;
            z-index: 10;
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        .camera-container {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        /*
         * AREA LIVE CAMERA
        */

        .video-wrapper {
            flex: 3;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * Kamera asli
        */

        #camera-feed {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            z-index: 1;
        }

        /*
         * Overlay frame di atas kamera.
         * Frame ini hanya sebagai panduan.
        */

        #camera-frame-overlay {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            z-index: 5;

            pointer-events: none;
        }

        /*
         * Area lubang kamera.
         * Dipakai untuk memberi indikasi area
         * yang akan masuk ke frame.
        */

        #camera-hole-guide {
            position: absolute;

            z-index: 4;

            border: 2px dashed rgba(255,255,255,.9);

            box-shadow:
                0 0 0 9999px rgba(0,0,0,.18);

            pointer-events: none;

            display: none;
        }

        /*
         * Kalau frame memiliki dekorasi,
         * guide bisa dimatikan supaya frame
         * transparannya yang menjadi panduan.
        */

        .countdown {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 80px;
            color: white;
            font-weight: bold;

            text-shadow:
                2px 2px 10px rgba(0,0,0,.5);

            z-index: 30;
        }

        .flash {
            position: absolute;
            inset: 0;

            background: white;

            opacity: 0;

            pointer-events: none;

            z-index: 40;
        }

        .flash.active {
            opacity: .8;
            transition: opacity .1s;
        }


        /* =====================================================
           PANEL FRAME + FOTO
        ===================================================== */

        .preview-wrapper {
            flex: 2;

            background: #e0e0e0;

            border-radius: 16px;

            padding: 10px;

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 0;

            overflow: hidden;
        }

        /*
         * Frame lengkap
        */

        .frame-preview-container {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        #camera-side-frame {
            position: absolute;

            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;

            z-index: 20;

            pointer-events: none;
        }

        /*
         * Container foto-foto.
         *
         * Setiap slot mempunyai frame kecil.
        */

        #photo-slots {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .photo-slot {
            position: absolute;

            cursor: pointer;

            border-radius: 5px;

            overflow: hidden;

            transition:
                transform .15s ease,
                outline .15s ease;

            z-index: 10;
        }

        .photo-slot:hover {
            transform: scale(1.015);

            outline:
                2px solid white;

            z-index: 25;
        }

        .photo-slot canvas {
            width: 100%;
            height: 100%;

            display: block;
        }

        /*
         * Nomor foto
        */

        .slot-number {
            position: absolute;

            top: 5px;
            left: 5px;

            width: 25px;
            height: 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0,0,0,.65);

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 50;

            pointer-events: none;
        }

        /*
         * Teks sebelum foto diambil
        */

        .slot-empty {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            color: white;

            font-size: 11px;
            font-weight: bold;

            background: rgba(0,0,0,.3);

            z-index: 40;

            pointer-events: none;
        }

        /*
         * Retake
        */

        .retake-label {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,.45);

            color: white;

            font-size: 12px;
            font-weight: bold;

            opacity: 0;

            transition: opacity .15s;

            z-index: 60;

            pointer-events: none;
        }

        .photo-slot:hover .retake-label {
            opacity: 1;
        }


        /* =====================================================
           EDITOR
        ===================================================== */

        .editor-container {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .canvas-area {
            flex: 3;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #e0e0e0;

            border-radius: 10px;

            min-height: 0;

            padding: 10px;

            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.1);
        }

        .tools-area {
            flex: 2;

            background: white;

            border-radius: 10px;

            padding: 15px;

            overflow-y: auto;
        }


        /* =====================================================
           RESULT
        ===================================================== */

        .result-container {
            display: flex;

            gap: 20px;

            flex: 1;

            min-height: 0;

            align-items: center;
        }

        .result-left {
            flex: 1;

            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #e0e0e0;

            border-radius: 12px;
        }

        .result-right {
            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: white;

            padding: 20px;

            border-radius: 12px;

            height: 100%;

            text-align: center;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading-overlay {
            display: none;

            position: absolute;

            inset: 0;

            background:
                rgba(255,255,255,.8);

            z-index: 10;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            border-radius: 10px;
        }

        .spinner {
            border: 4px solid #f3f3f3;

            border-top: 4px solid #000;

            border-radius: 50%;

            width: 40px;
            height: 40px;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .camera-container {
                flex-direction: column;
            }

            .video-wrapper {
                min-height: 50vh;
            }

            .preview-wrapper {
                min-height: 30vh;
            }

            .editor-container,
            .result-container {
                flex-direction: column;
            }

            .canvas-area,
            .result-left {
                min-height: 50vh;
            }

            .tools-area,
            .result-right {
                width: 100%;
            }
        }

    </style>
</head>

<body>


    <!-- =====================================================
         START
    ===================================================== -->

    <div
        id="start-screen"
        class="screen active"
    >

        <div
            style="
                flex:1;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
            "
        >

            <h1>
                Photobooth
            </h1>

            <p>
                Capture your moments beautifully
            </p>

        </div>

        <div class="bottom-actions">

            <button
                onclick="nav('frame-screen')"
            >
                Mulai Sesi
            </button>

        </div>

    </div>


    <!-- =====================================================
         PILIH FRAME
    ===================================================== -->

    <div
        id="frame-screen"
        class="screen"
    >

        <h2>
            Pilih Frame
        </h2>


        <div
            class="frame-grid"
            id="frame-list"
        >

            <div
                class="frame-item"
                style="
                    background-image:
                    url('frame/default.png');

                    background-size:cover;
                    background-position:center;
                "
                onclick="
                    selectFrame(
                        this,
                        'frame/default.png'
                    )
                "
            ></div>

        </div>


        <div class="bottom-actions">

            <button
                id="btn-continue-camera"
                disabled
                onclick="
                    nav('camera-screen');
                    initCamera();
                "
            >
                Pilih Frame Dulu
            </button>

        </div>

    </div>


    <!-- =====================================================
         CAMERA
    ===================================================== -->

    <div
        id="camera-screen"
        class="screen"
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                margin-bottom:12px;
                align-items:center;
            "
        >

            <h2 style="margin:0;">
                Kamera
            </h2>

            <button
                class="outline"
                style="
                    width:auto;
                    padding:6px 12px;
                    font-size:12px;
                    margin:0;
                "
                onclick="toggleMirror()"
            >
                Balik Kamera
            </button>

        </div>


        <div class="camera-container">


            <!-- =================================================
                 LIVE CAMERA
            ================================================= -->

            <div class="video-wrapper">

                <video
                    id="camera-feed"
                    autoplay
                    playsinline
                ></video>


                <!-- Frame transparan sebagai overlay -->

                <img
                    id="camera-frame-overlay"
                    src=""
                    alt=""
                >


                <!-- Guide lubang -->

                <div
                    id="camera-hole-guide"
                ></div>


                <div
                    id="countdown"
                    class="countdown"
                ></div>


                <div
                    id="flash"
                    class="flash"
                ></div>

            </div>


            <!-- =================================================
                 FRAME + HASIL FOTO
            ================================================= -->

            <div class="preview-wrapper">

                <div
                    class="frame-preview-container"
                >

                    <!-- Foto ditempatkan di sini -->

                    <div
                        id="photo-slots"
                    ></div>


                    <!-- Frame lengkap -->

                    <img
                        id="camera-side-frame"
                        src=""
                        alt="Frame"
                    >

                </div>

            </div>

        </div>


        <div class="bottom-actions">

            <button
                id="btn-take"
                onclick="takePhotos()"
            >
                Ambil Foto
            </button>


            <button
                id="btn-next-preview"
                disabled
                onclick="
                    nav('preview-screen');
                    loadPreview();
                "
            >
                Lanjutkan
            </button>

        </div>

    </div>


    <!-- =====================================================
         PREVIEW
    ===================================================== -->

    <div
        id="preview-screen"
        class="screen"
    >

        <h2>
            Preview & Edit
        </h2>


        <div class="editor-container">

            <div class="canvas-area">

                <canvas
                    id="result-canvas"
                ></canvas>


                <div
                    id="loading-overlay"
                >

                    <div class="spinner"></div>

                    <p
                        style="
                            margin-top:10px;
                            font-weight:bold;
                        "
                    >
                        Memproses...
                    </p>

                </div>

            </div>


            <div class="tools-area">

                <h3 style="margin-top:0;">
                    Filter Warna
                </h3>


                <div
                    style="
                        display:flex;
                        flex-direction:column;
                        gap:8px;
                        margin-bottom:20px;
                    "
                >

                    <button
                        class="outline"
                        onclick="
                            applyFilter('none')
                        "
                    >
                        Original
                    </button>


                    <button
                        class="outline"
                        onclick="
                            applyFilter(
                                'grayscale(100%)'
                            )
                        "
                    >
                        Hitam Putih
                    </button>


                    <button
                        class="outline"
                        onclick="
                            applyFilter(
                                'sepia(100%)'
                            )
                        "
                    >
                        Retro / Sepia
                    </button>

                </div>

            </div>

        </div>


        <div class="bottom-actions">

            <button
                onclick="
                    processAndUploadSession()
                "
            >
                Selesai & Proses Otomatis
            </button>

        </div>

    </div>


    <!-- =====================================================
         RESULT
    ===================================================== -->

    <div
        id="result-screen"
        class="screen"
    >

        <h2>
            Sesi Selesai
        </h2>


        <div class="result-container">


            <div class="result-left">

                <canvas
                    id="final-preview-canvas"
                    style="
                        max-height:100%;
                        border-radius:8px;
                    "
                ></canvas>

            </div>


            <div class="result-right">

                <h3 style="margin-top:0;">
                    Scan untuk Unduh Folder Sesi
                </h3>


                <div
                    id="qrcode-container"
                    style="margin:10px 0;"
                >

                    <div
                        class="spinner"
                        style="margin:20px auto;"
                    ></div>

                </div>


                <p
                    id="qr-status-text"
                    style="
                        font-size:11px;
                        color:#666;
                        margin-bottom:15px;
                    "
                >
                    Mengunggah file ke Drive...
                </p>


                <div
                    style="
                        display:flex;
                        flex-direction:column;
                        gap:8px;
                        width:100%;
                    "
                >

                    <button
                        onclick="downloadImage()"
                    >
                        ⬇️ Unduh Foto Frame
                    </button>


                    <button
                        class="outline"
                        onclick="downloadTanpaFrame()"
                    >
                        🖼️ Unduh Foto Satuan
                    </button>


                    <button
                        class="outline"
                        onclick="location.reload()"
                        style="
                            background-color:#ffebeb;
                            color:red;
                            border-color:red;
                        "
                    >
                        🔄 Sesi Baru
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           NAVIGATION
        ===================================================== */

        function nav(screenId) {

            document
                .querySelectorAll('.screen')
                .forEach(
                    s =>
                        s.classList.remove('active')
                );

            document
                .getElementById(screenId)
                .classList.add('active');

        }


        /* =====================================================
           VARIABLE
        ===================================================== */

        let requiredPhotos = 0;

        let selectedFramePath = '';

        let frameHoles = [];

        let stream = null;

        let isMirrored = true;

        let capturedImages = [];

        let finalFrameImageObj = null;

        let currentCanvasFilter = 'none';


        /* =====================================================
           LOAD FRAME
        ===================================================== */

        async function loadFrameImage(src) {

            return new Promise(
                (resolve, reject) => {

                    const img =
                        new Image();

                    img.onload = () => {

                        finalFrameImageObj =
                            img;

                        resolve(img);

                    };

                    img.onerror = () => {

                        reject(
                            'Frame tidak dapat dimuat.'
                        );

                    };

                    img.src = src;

                }
            );

        }


        /* =====================================================
           DETECT HOLES
        ===================================================== */

        async function detectFrameHoles(
            imgSrc
        ) {

            return new Promise(
                (resolve, reject) => {

                    const img =
                        new Image();

                    img.src =
                        imgSrc;


                    img.onload = () => {

                        finalFrameImageObj =
                            img;


                        const canvas =
                            document.createElement(
                                'canvas'
                            );


                        const ctx =
                            canvas.getContext(
                                '2d',
                                {
                                    willReadFrequently:
                                        true
                                }
                            );


                        const width =
                            img.width;

                        const height =
                            img.height;


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        ctx.drawImage(
                            img,
                            0,
                            0
                        );


                        const imgData =
                            ctx.getImageData(
                                0,
                                0,
                                width,
                                height
                            );


                        const data =
                            imgData.data;


                        const visited =
                            new Uint8Array(
                                width * height
                            );


                        const holes = [];


                        for (
                            let y = 0;
                            y < height;
                            y++
                        ) {

                            for (
                                let x = 0;
                                x < width;
                                x++
                            ) {

                                const index =
                                    y * width + x;


                                if (
                                    data[
                                        index * 4 + 3
                                    ] < 10 &&
                                    visited[index] === 0
                                ) {

                                    let minX = x;
                                    let maxX = x;

                                    let minY = y;
                                    let maxY = y;


                                    const stack =
                                        [index];


                                    while (
                                        stack.length > 0
                                    ) {

                                        const idx =
                                            stack.pop();


                                        if (
                                            visited[idx]
                                        ) {
                                            continue;
                                        }


                                        const px =
                                            idx % width;

                                        const py =
                                            Math.floor(
                                                idx / width
                                            );


                                        if (
                                            data[
                                                idx * 4 + 3
                                            ] >= 10
                                        ) {
                                            continue;
                                        }


                                        visited[idx] =
                                            1;


                                        if (
                                            px < minX
                                        )
                                            minX = px;


                                        if (
                                            px > maxX
                                        )
                                            maxX = px;


                                        if (
                                            py < minY
                                        )
                                            minY = py;


                                        if (
                                            py > maxY
                                        )
                                            maxY = py;


                                        if (
                                            px + 1 <
                                            width
                                        )
                                            stack.push(
                                                idx + 1
                                            );


                                        if (
                                            px - 1 >= 0
                                        )
                                            stack.push(
                                                idx - 1
                                            );


                                        if (
                                            py + 1 <
                                            height
                                        )
                                            stack.push(
                                                idx + width
                                            );


                                        if (
                                            py - 1 >= 0
                                        )
                                            stack.push(
                                                idx - width
                                            );

                                    }


                                    if (
                                        (maxX - minX) > 80 &&
                                        (maxY - minY) > 80
                                    ) {

                                        holes.push({

                                            x: minX,

                                            y: minY,

                                            w:
                                                maxX -
                                                minX,

                                            h:
                                                maxY -
                                                minY

                                        });

                                    }

                                }

                            }

                        }


                        holes.sort(
                            (a,b) => {

                                if (
                                    Math.abs(
                                        a.y - b.y
                                    ) < 20
                                ) {

                                    return (
                                        a.x - b.x
                                    );

                                }

                                return (
                                    a.y - b.y
                                );

                            }
                        );


                        resolve(
                            holes
                        );

                    };


                    img.onerror =
                        () =>
                            reject(
                                'Gambar tidak ditemukan.'
                            );

                }
            );

        }


        /* =====================================================
           SELECT FRAME
        ===================================================== */

        async function selectFrame(
            el,
            framePath
        ) {

            document
                .querySelectorAll(
                    '.frame-item'
                )
                .forEach(
                    f =>
                        f.classList.remove(
                            'selected'
                        )
                );


            el.classList.add(
                'selected'
            );


            selectedFramePath =
                framePath;


            const btn =
                document.getElementById(
                    'btn-continue-camera'
                );


            btn.disabled =
                true;


            btn.innerText =
                'Memindai Frame...';


            try {

                frameHoles =
                    await detectFrameHoles(
                        framePath
                    );


                requiredPhotos =
                    frameHoles.length;


                if (
                    requiredPhotos === 0
                ) {

                    alert(
                        'Frame tidak memiliki lubang transparan!'
                    );

                    btn.innerText =
                        'Pilih Frame Dulu';

                    return;

                }


                await loadFrameImage(
                    framePath
                );


                btn.disabled =
                    false;


                btn.innerText =
                    `Lanjut (${requiredPhotos} Foto)`;


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    error
                );

            }

        }


        /* =====================================================
           INIT CAMERA
        ===================================================== */

        async function initCamera() {

            try {

                if (stream) {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }


                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode:
                                    'user',

                                width: {
                                    ideal:
                                        1280
                                },

                                height: {
                                    ideal:
                                        720
                                }

                            }

                        });


                const video =
                    document.getElementById(
                        'camera-feed'
                    );


                video.srcObject =
                    stream;


                /*
                 * Pasang frame overlay
                 */

                const overlay =
                    document.getElementById(
                        'camera-frame-overlay'
                    );


                overlay.src =
                    selectedFramePath;


                /*
                 * Reset foto
                 */

                capturedImages =
                    new Array(
                        requiredPhotos
                    );


                /*
                 * Buat preview frame
                 */

                buildFramePreview();


                /*
                 * Reset tombol
                 */

                document
                    .getElementById(
                        'btn-take'
                    )
                    .disabled =
                    false;


                document
                    .getElementById(
                        'btn-next-preview'
                    )
                    .disabled =
                    true;


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    'Izin Kamera diperlukan.'
                );

            }

        }


        /* =====================================================
           BUILD FRAME PREVIEW
        ===================================================== */

        function buildFramePreview() {

            const container =
                document.getElementById(
                    'photo-slots'
                );


            container.innerHTML =
                '';


            /*
             * Frame preview menggunakan
             * rasio asli frame.
             */

            const frame =
                finalFrameImageObj;


            if (!frame)
                return;


            /*
             * Hitung ukuran frame
             */

            const parent =
                document.querySelector(
                    '.frame-preview-container'
                );


            const parentWidth =
                parent.clientWidth;


            const parentHeight =
                parent.clientHeight;


            const frameRatio =
                frame.width /
                frame.height;


            let frameWidth =
                parentWidth;


            let frameHeight =
                frameWidth /
                frameRatio;


            if (
                frameHeight >
                parentHeight
            ) {

                frameHeight =
                    parentHeight;

                frameWidth =
                    frameHeight *
                    frameRatio;

            }


            /*
             * Ukuran frame relatif
             */

            const left =
                (
                    parentWidth -
                    frameWidth
                ) / 2;


            const top =
                (
                    parentHeight -
                    frameHeight
                ) / 2;


            /*
             * Buat slot berdasarkan
             * koordinat lubang.
             */

            frameHoles.forEach(
                (hole, index) => {

                    const slot =
                        document.createElement(
                            'div'
                        );


                    slot.className =
                        'photo-slot';


                    /*
                     * Posisi hole pada layar
                     */

                    const leftPx =
                        left +
                        (
                            hole.x /
                            frame.width
                        ) *
                        frameWidth;


                    const topPx =
                        top +
                        (
                            hole.y /
                            frame.height
                        ) *
                        frameHeight;


                    const widthPx =
                        (
                            hole.w /
                            frame.width
                        ) *
                        frameWidth;


                    const heightPx =
                        (
                            hole.h /
                            frame.height
                        ) *
                        frameHeight;


                    slot.style.left =
                        `${leftPx}px`;


                    slot.style.top =
                        `${topPx}px`;


                    slot.style.width =
                        `${widthPx}px`;


                    slot.style.height =
                        `${heightPx}px`;


                    slot.dataset.index =
                        index;


                    /*
                     * Canvas
                     */

                    const canvas =
                        document.createElement(
                            'canvas'
                        );


                    canvas.width =
                        hole.w;

                    canvas.height =
                        hole.h;


                    slot.appendChild(
                        canvas
                    );


                    /*
                     * Nomor
                     */

                    const number =
                        document.createElement(
                            'div'
                        );


                    number.className =
                        'slot-number';


                    number.innerText =
                        index + 1;


                    slot.appendChild(
                        number
                    );


                    /*
                     * Empty
                     */

                    const empty =
                        document.createElement(
                            'div'
                        );


                    empty.className =
                        'slot-empty';


                    empty.innerHTML =
                        `Foto ${index + 1}<br>Belum diambil`;


                    slot.appendChild(
                        empty
                    );


                    /*
                     * Retake
                     */

                    const retake =
                        document.createElement(
                            'div'
                        );


                    retake.className =
                        'retake-label';


                    retake.innerText =
                        '↻ Ambil Ulang';


                    slot.appendChild(
                        retake
                    );


                    /*
                     * Klik slot
                     */

                    slot.onclick =
                        () => {

                            retakePhoto(
                                index
                            );

                        };


                    container.appendChild(
                        slot
                    );


                    /*
                     * Render slot
                     */

                    renderSlot(
                        index
                    );

                }
            );


            /*
             * Frame di atas
             */

            const frameImage =
                document.getElementById(
                    'camera-side-frame'
                );


            frameImage.src =
                selectedFramePath;


            frameImage.style.width =
                `${frameWidth}px`;


            frameImage.style.height =
                `${frameHeight}px`;

        }


        /* =====================================================
           RENDER SLOT
        ===================================================== */

        function renderSlot(
            index
        ) {

            const slots =
                document.querySelectorAll(
                    '.photo-slot'
                );


            const slot =
                slots[index];


            if (!slot)
                return;


            const canvas =
                slot.querySelector(
                    'canvas'
                );


            const ctx =
                canvas.getContext(
                    '2d'
                );


            const hole =
                frameHoles[index];


            /*
             * Bersihkan
             */

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * Background
             */

            ctx.fillStyle =
                '#222';


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * Jika belum ada foto
             */

            if (
                !capturedImages[index]
            ) {

                return;

            }


            const img =
                new Image();


            img.onload =
                () => {

                    drawImageIntoHole(
                        ctx,
                        img,
                        {
                            x: 0,
                            y: 0,
                            w: hole.w,
                            h: hole.h
                        }
                    );

                };


            img.src =
                capturedImages[index];

        }


        /* =====================================================
           DRAW IMAGE INTO HOLE
        ===================================================== */

        function drawImageIntoHole(
            ctx,
            img,
            target
        ) {

            const imgRatio =
                img.width /
                img.height;


            const targetRatio =
                target.w /
                target.h;


            let sW =
                img.width;


            let sH =
                img.height;


            let sX = 0;

            let sY = 0;


            /*
             * Crop tengah
             */

            if (
                imgRatio >
                targetRatio
            ) {

                sW =
                    img.height *
                    targetRatio;


                sX =
                    (
                        img.width -
                        sW
                    ) / 2;

            } else {

                sH =
                    img.width /
                    targetRatio;


                sY =
                    (
                        img.height -
                        sH
                    ) / 2;

            }


            ctx.drawImage(

                img,

                sX,
                sY,
                sW,
                sH,

                target.x,
                target.y,
                target.w,
                target.h

            );

        }


        /* =====================================================
           TOGGLE MIRROR
        ===================================================== */

        function toggleMirror() {

            isMirrored =
                !isMirrored;


            document
                .getElementById(
                    'camera-feed'
                )
                .style.transform =
                isMirrored
                    ? 'scaleX(-1)'
                    : 'scaleX(1)';

        }


        /* =====================================================
           TAKE ALL PHOTOS
        ===================================================== */

        async function takePhotos() {

            const button =
                document.getElementById(
                    'btn-take'
                );


            button.disabled =
                true;


            for (
                let i = 0;
                i < requiredPhotos;
                i++
            ) {

                await runCountdown();

                captureFrame(
                    i
                );

            }


            document
                .getElementById(
                    'btn-next-preview'
                )
                .disabled =
                false;

        }


        /* =====================================================
           RETAKE
        ===================================================== */

        async function retakePhoto(
            index
        ) {

            if (!stream)
                return;


            /*
             * Jangan retake saat countdown
             */

            const countdown =
                document
                    .getElementById(
                        'countdown'
                    );


            if (
                countdown.innerText
            ) {

                return;

            }


            const slots =
                document.querySelectorAll(
                    '.photo-slot'
                );


            slots.forEach(
                slot => {

                    slot.style.pointerEvents =
                        'none';

                }
            );


            await runCountdown();


            captureFrame(
                index
            );


            slots.forEach(
                slot => {

                    slot.style.pointerEvents =
                        'auto';

                }
            );


            document
                .getElementById(
                    'btn-next-preview'
                )
                .disabled =
                false;

        }


        /* =====================================================
           COUNTDOWN
        ===================================================== */

        function runCountdown() {

            return new Promise(
                resolve => {

                    let count =
                        3;


                    const el =
                        document
                            .getElementById(
                                'countdown'
                            );


                    el.innerText =
                        count;


                    const interval =
                        setInterval(
                            () => {

                                count--;


                                if (
                                    count > 0
                                ) {

                                    el.innerText =
                                        count;

                                } else {

                                    clearInterval(
                                        interval
                                    );


                                    el.innerText =
                                        '';


                                    const flash =
                                        document
                                            .getElementById(
                                                'flash'
                                            );


                                    flash.classList
                                        .add(
                                            'active'
                                        );


                                    setTimeout(
                                        () => {

                                            flash.classList
                                                .remove(
                                                    'active'
                                                );

                                        },
                                        120
                                    );


                                    resolve();

                                }

                            },
                            700
                        );

                }
            );

        }


        /* =====================================================
           CAPTURE
        ===================================================== */

        function captureFrame(
            index
        ) {

            const video =
                document
                    .getElementById(
                        'camera-feed'
                    );


            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                return;

            }


            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            const ctx =
                canvas.getContext(
                    '2d'
                );


            /*
             * Mirror sama seperti preview
             */

            if (
                isMirrored
            ) {

                ctx.translate(
                    canvas.width,
                    0
                );

                ctx.scale(
                    -1,
                    1
                );

            }


            ctx.drawImage(
                video,
                0,
                0
            );


            /*
             * Simpan
             */

            capturedImages[index] =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );


            /*
             * Render preview
             */

            renderSlot(
                index
            );


            /*
             * Hilangkan tulisan kosong
             */

            const slot =
                document.querySelectorAll(
                    '.photo-slot'
                )[index];


            if (slot) {

                const empty =
                    slot.querySelector(
                        '.slot-empty'
                    );


                if (empty) {

                    empty.style.display =
                        'none';

                }

            }

        }


        /* =====================================================
           LOAD PREVIEW
        ===================================================== */

        function loadPreview() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                stream =
                    null;

            }


            drawCanvas(
                true,
                'result-canvas'
            );

        }


        /* =====================================================
           FILTER
        ===================================================== */

        function applyFilter(
            filterCss
        ) {

            currentCanvasFilter =
                filterCss;


            drawCanvas(
                true,
                'result-canvas'
            );

        }


        /* =====================================================
           DRAW FINAL CANVAS
        ===================================================== */

        async function drawCanvas(
            withFrame = true,
            canvasId =
                'result-canvas'
        ) {

            const canvas =
                document.getElementById(
                    canvasId
                );


            const ctx =
                canvas.getContext(
                    '2d'
                );


            canvas.width =
                finalFrameImageObj.width;


            canvas.height =
                finalFrameImageObj.height;


            ctx.fillStyle =
                '#FFFFFF';


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.filter =
                currentCanvasFilter;


            const promises =
                capturedImages.map(
                    (src, index) => {

                        return new Promise(
                            resolve => {

                                if (!src) {

                                    resolve();

                                    return;

                                }


                                const img =
                                    new Image();


                                img.onload =
                                    () => {

                                        const hole =
                                            frameHoles[
                                                index
                                            ];


                                        drawImageIntoHole(

                                            ctx,

                                            img,

                                            hole

                                        );


                                        resolve();

                                    };


                                img.onerror =
                                    () =>
                                        resolve();


                                img.src =
                                    src;

                            }
                        );

                    }
                );


            await Promise.all(
                promises
            );


            /*
             * Frame di paling atas
             */

            if (
                withFrame
            ) {

                ctx.filter =
                    'none';


                ctx.drawImage(

                    finalFrameImageObj,

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );

            }

        }


        /* =====================================================
           DOWNLOAD FRAME
        ===================================================== */

        function downloadImage() {

            const link =
                document.createElement(
                    'a'
                );


            link.download =
                `photobooth_frame_${Date.now()}.png`;


            link.href =
                document
                    .getElementById(
                        'result-canvas'
                    )
                    .toDataURL(
                        'image/png'
                    );


            link.click();

        }


        /* =====================================================
           DOWNLOAD INDIVIDUAL
        ===================================================== */

        function downloadTanpaFrame() {

            capturedImages.forEach(
                (imgData, index) => {

                    if (!imgData)
                        return;


                    const link =
                        document.createElement(
                            'a'
                        );


                    link.download =
                        `foto_satuan_${index + 1}_${Date.now()}.png`;


                    link.href =
                        imgData;


                    link.click();

                }
            );

        }


        /* =====================================================
           UPLOAD
        ===================================================== */

        async function processAndUploadSession() {

            nav(
                'result-screen'
            );


            await drawCanvas(
                true,
                'final-preview-canvas'
            );


            /*
             * Pastikan result canvas
             * juga sudah dibuat.
             */

            await drawCanvas(
                true,
                'result-canvas'
            );


            const frameImageData =
                document
                    .getElementById(
                        'result-canvas'
                    )
                    .toDataURL(
                        'image/png'
                    );


            /*
             * GIF
             */

            gifshot.createGIF(

                {

                    images: [
                        ...capturedImages,
                        frameImageData
                    ],

                    interval:
                        0.6,

                    gifWidth:
                        600,

                    gifHeight:
                        Math.floor(
                            600 *
                            (
                                finalFrameImageObj.height /
                                finalFrameImageObj.width
                            )
                        ),

                    numFrames:
                        capturedImages.length + 1

                },

                async function(obj) {

                    let gifData =
                        "";


                    if (
                        !obj.error
                    ) {

                        gifData =
                            obj.image;

                    }


                    try {

                        const response =
                            await fetch(
                                '/upload-session',
                                {

                                    method:
                                        'POST',

                                    headers: {

                                        'Content-Type':
                                            'application/json'

                                    },

                                    body:
                                        JSON.stringify({

                                            frameImage:
                                                frameImageData,

                                            individualImages:
                                                capturedImages,

                                            gifImage:
                                                gifData

                                        })

                                }
                            );


                        const result =
                            await response.json();


                        if (
                            result.success
                        ) {

                            const qrContainer =
                                document.getElementById(
                                    'qrcode-container'
                                );


                            qrContainer.innerHTML =
                                '';


                            new QRCode(

                                qrContainer,

                                {

                                    text:
                                        result.folder_link,

                                    width:
                                        170,

                                    height:
                                        170,

                                    colorDark:
                                        '#000000',

                                    colorLight:
                                        '#ffffff',

                                    correctLevel:
                                        QRCode
                                            .CorrectLevel
                                            .H

                                }

                            );


                            document
                                .getElementById(
                                    'qr-status-text'
                                )
                                .innerText =
                                'Scan untuk unduh folder sesi!';

                        } else {

                            alert(
                                'Gagal membuat folder di Drive.'
                            );

                        }

                    } catch (error) {

                        console.error(
                            'Error:',
                            error
                        );


                        alert(
                            'Gagal menghubungi server Node.js.'
                        );

                    }

                }

            );

        }


        /* =====================================================
           WINDOW RESIZE
           ===================================================== */

        window.addEventListener(
            'resize',
            () => {

                /*
                 * Kalau sedang di kamera,
                 * hitung ulang posisi lubang.
                 */

                const cameraScreen =
                    document.getElementById(
                        'camera-screen'
                    );


                if (
                    cameraScreen.classList
                        .contains('active') &&
                    finalFrameImageObj
                ) {

                    buildFramePreview();

                }

            }
        );

    </script>
