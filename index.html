<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photobooth Web</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        :root {
            --bg-color: #F5F5F7;
            --primary: #000000;
            --on-primary: #FFFFFF;
            --text-secondary: #777777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--primary);
        }


        /* =====================================================
           SCREEN
        ===================================================== */

        .screen {
            display: none;

            height: 100vh;

            padding: 16px 24px;

            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }


        h1 {
            font-size: 32px;
            margin: 0 0 8px 0;
        }

        h2 {
            margin: 0 0 16px 0;
        }

        p {
            color: var(--text-secondary);
            margin: 0 0 24px 0;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .bottom-actions {
            margin-top: auto;
            padding-top: 16px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: center;
        }

        button {
            background-color: var(--primary);

            color: var(--on-primary);

            border: none;

            border-radius: 30px;

            padding: 12px 20px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                opacity 0.2s,
                transform 0.15s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        button.outline {
            background-color: transparent;

            color: var(--primary);

            border: 2px solid var(--primary);
        }


        /* =====================================================
           FRAME SELECT
        ===================================================== */

        .frame-grid {

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 30px;

            flex: 1;

            width: 100%;

            overflow-x: auto;

            overflow-y: hidden;

            padding: 40px 80px;

            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .frame-grid::-webkit-scrollbar {
            display: none;
        }


        .frame-item {

            flex: 0 0 230px;

            height: 330px;

            background-color: #ddd;

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            border-radius: 14px;

            cursor: pointer;

            border: 3px solid transparent;

            position: relative;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .frame-item:hover {
            transform: scale(1.02);
        }

        .frame-item.selected {

            border-color: #000;

            transform: scale(1.05);

            box-shadow: none;
        }


        /* =====================================================
           CHECK MARK
        ===================================================== */

        .frame-item.selected::after {

            content: "✓";

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: #fff;

            font-size: 64px;

            font-weight: 700;

            line-height: 1;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.55),
                0 0 10px rgba(0, 0, 0, 0.35);

            pointer-events: none;

            z-index: 100;
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        .camera-container {

            display: flex;

            gap: 16px;

            flex: 1;

            min-height: 0;
        }


        .video-wrapper {

            flex: 3;

            background: #000;

            border-radius: 16px;

            overflow: hidden;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 0;
        }


        #camera-feed {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            background: #000;
        }


        /* =====================================================
           COUNTDOWN
        ===================================================== */

        .countdown {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 80px;

            color: white;

            font-weight: bold;

            text-shadow:
                2px 2px 10px rgba(0, 0, 0, 0.5);

            z-index: 100;
        }


        /* =====================================================
           FLASH
        ===================================================== */

        .flash {

            position: absolute;

            inset: 0;

            background: white;

            opacity: 0;

            pointer-events: none;

            z-index: 200;
        }

        .flash.active {

            opacity: 0.8;

            transition:
                opacity 0.1s;
        }


        /* =====================================================
           RIGHT PREVIEW
        ===================================================== */

        .preview-wrapper {

            flex: 2;

            background: #e0e0e0;

            border-radius: 16px;

            padding: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 0;

            overflow: hidden;
        }


        .frame-preview-container {

            position: relative;

            width: 100%;

            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* FRAME UTAMA */

        #camera-side-frame {

            position: absolute;

            object-fit: contain;

            pointer-events: none;

            z-index: 20;
        }


        /* FOTO-FOTO */

        #photo-slots {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            z-index: 10;
        }


        .photo-slot {

            position: absolute;

            overflow: hidden;

            border-radius: 3px;

            cursor: pointer;

            z-index: 10;

            transition:
                transform 0.15s ease,
                outline 0.15s ease;
        }


        /*
         * FOTO YANG SUDAH DIAMBIL
         */

        .photo-slot.has-photo:hover {

            transform: scale(1.015);

            outline:
                2px solid white;

            z-index: 50;
        }


        .photo-slot canvas {

            width: 100%;

            height: 100%;

            display: block;
        }


        /* NOMOR FOTO */

        .slot-number {

            position: absolute;

            top: 5px;

            left: 5px;

            width: 25px;

            height: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 11px;

            font-weight: bold;

            z-index: 70;

            pointer-events: none;
        }


        /* BELUM ADA FOTO */

        .slot-empty {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: white;

            font-size: 11px;

            font-weight: bold;

            background:
                rgba(0, 0, 0, 0.35);

            z-index: 30;

            pointer-events: none;
        }


        /* RETAKE */

        .retake-label {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.55);

            color: white;

            font-size: 12px;

            font-weight: bold;

            opacity: 0;

            transition:
                opacity 0.15s;

            z-index: 60;

            pointer-events: none;
        }


        .photo-slot.has-photo:hover .retake-label {

            opacity: 1;
        }


        /* =====================================================
           EDITOR
        ===================================================== */

        .editor-container {

            display: flex;

            gap: 16px;

            flex: 1;

            min-height: 0;
        }


        .canvas-area {

            flex: 3;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #e0e0e0;

            border-radius: 10px;

            min-height: 0;

            padding: 10px;

            position: relative;
        }


        canvas {

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }


        .tools-area {

            flex: 2;

            background: white;

            border-radius: 10px;

            padding: 15px;

            overflow-y: auto;
        }


        /* =====================================================
           RESULT
        ===================================================== */

        .result-container {

            display: flex;

            gap: 20px;

            flex: 1;

            min-height: 0;

            align-items: center;
        }


        .result-left {

            flex: 1;

            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #e0e0e0;

            border-radius: 12px;
        }


        .result-right {

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: white;

            padding: 20px;

            border-radius: 12px;

            height: 100%;

            text-align: center;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading-overlay {

            display: none;

            position: absolute;

            inset: 0;

            background:
                rgba(255, 255, 255, 0.8);

            z-index: 10;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            border-radius: 10px;
        }


        .spinner {

            border:
                4px solid #f3f3f3;

            border-top:
                4px solid #000;

            border-radius: 50%;

            width: 40px;

            height: 40px;

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .frame-item {

                flex-basis: 190px;

                height: 280px;
            }


            .frame-grid {

                padding:
                    30px 40px;
            }


            .camera-container {

                flex-direction: column;
            }


            .video-wrapper {

                min-height: 50vh;
            }


            .preview-wrapper {

                min-height: 30vh;
            }


            .editor-container,
            .result-container {

                flex-direction: column;
            }


            .canvas-area,
            .result-left {

                min-height: 50vh;
            }


            .tools-area,
            .result-right {

                width: 100%;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         START SCREEN
    ===================================================== -->

    <div
        id="start-screen"
        class="screen active"
    >

        <div
            style="
                flex:1;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
            "
        >

            <h1>
                Photobooth
            </h1>

            <p>
                Capture your moments beautifully
            </p>

        </div>


        <div class="bottom-actions">

            <button
                onclick="nav('frame-screen')"
            >
                Mulai Sesi
            </button>

        </div>

    </div>



    <!-- =====================================================
         FRAME SCREEN
    ===================================================== -->

    <div
        id="frame-screen"
        class="screen"
    >

        <h2>
            Pilih Frame
        </h2>


        <div
            class="frame-grid"
            id="frame-list"
        >

            <div
                class="frame-item"

                style="
                    background-image:
                    url('frame/default.png');

                    background-size: cover;

                    background-position: center;
                "

                onclick="
                    selectFrame(
                        this,
                        'frame/default.png'
                    )
                "
            ></div>

        </div>


        <div class="bottom-actions">

            <button
                id="btn-continue-camera"

                disabled

                onclick="
                    nav('camera-screen');
                    initCamera();
                "
            >
                Pilih Frame Dulu
            </button>

        </div>

    </div>



    <!-- =====================================================
         CAMERA SCREEN
    ===================================================== -->

    <div
        id="camera-screen"
        class="screen"
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                margin-bottom:12px;
                align-items:center;
            "
        >

            <h2 style="margin:0;">
                Kamera
            </h2>


            <button
                class="outline"

                style="
                    width:auto;
                    padding:6px 12px;
                    font-size:12px;
                    margin:0;
                "

                onclick="toggleMirror()"
            >
                Balik Kamera
            </button>

        </div>


        <div class="camera-container">


            <!-- LIVE CAMERA -->

            <div
                class="video-wrapper"
                id="video-wrapper"
            >

                <video
                    id="camera-feed"
                    autoplay
                    playsinline
                ></video>


                <div
                    id="countdown"
                    class="countdown"
                ></div>


                <div
                    id="flash"
                    class="flash"
                ></div>

            </div>



            <!-- FRAME + HASIL FOTO -->

            <div class="preview-wrapper">

                <div
                    class="frame-preview-container"
                    id="frame-preview-container"
                >

                    <div
                        id="photo-slots"
                    ></div>


                    <img
                        id="camera-side-frame"
                        src=""
                        alt="Frame"
                    >

                </div>

            </div>

        </div>


        <div class="bottom-actions">

            <button
                id="btn-take"
                onclick="takePhotos()"
            >
                Ambil Foto
            </button>


            <button
                id="btn-next-preview"

                disabled

                onclick="
                    nav('preview-screen');
                    loadPreview();
                "
            >
                Lanjutkan
            </button>

        </div>

    </div>



    <!-- =====================================================
         PREVIEW SCREEN
    ===================================================== -->

    <div
        id="preview-screen"
        class="screen"
    >

        <h2>
            Preview & Edit
        </h2>


        <div class="editor-container">

            <div class="canvas-area">

                <canvas
                    id="result-canvas"
                ></canvas>


                <div
                    id="loading-overlay"
                >

                    <div class="spinner"></div>

                    <p
                        style="
                            margin-top:10px;
                            font-weight:bold;
                        "
                    >
                        Memproses...
                    </p>

                </div>

            </div>


            <div class="tools-area">

                <h3 style="margin-top:0;">
                    Filter Warna
                </h3>


                <div
                    style="
                        display:flex;
                        flex-direction:column;
                        gap:8px;
                        margin-bottom:20px;
                    "
                >

                    <button
                        class="outline"

                        onclick="
                            applyFilter('none')
                        "
                    >
                        Original
                    </button>


                    <button
                        class="outline"

                        onclick="
                            applyFilter(
                                'grayscale(100%)'
                            )
                        "
                    >
                        Hitam Putih
                    </button>


                    <button
                        class="outline"

                        onclick="
                            applyFilter(
                                'sepia(100%)'
                            )
                        "
                    >
                        Retro / Sepia
                    </button>

                </div>

            </div>

        </div>


        <div class="bottom-actions">

            <button
                onclick="
                    processAndUploadSession()
                "
            >
                Selesai & Proses Otomatis
            </button>

        </div>

    </div>



    <!-- =====================================================
         RESULT SCREEN
    ===================================================== -->

    <div
        id="result-screen"
        class="screen"
    >

        <h2>
            Sesi Selesai
        </h2>


        <div class="result-container">

            <div class="result-left">

                <canvas
                    id="final-preview-canvas"

                    style="
                        max-height:100%;
                        border-radius:8px;
                    "
                ></canvas>

            </div>


            <div class="result-right">

                <h3 style="margin-top:0;">
                    Scan untuk Unduh Folder Sesi
                </h3>


                <div
                    id="qrcode-container"

                    style="
                        margin:10px 0;
                    "
                >

                    <div
                        class="spinner"

                        style="
                            margin:20px auto;
                        "
                    ></div>

                </div>


                <p
                    id="qr-status-text"

                    style="
                        font-size:11px;
                        color:#666;
                        margin-bottom:15px;
                    "
                >
                    Mengunggah file ke Drive...
                </p>


                <div
                    style="
                        display:flex;
                        flex-direction:column;
                        gap:8px;
                        width:100%;
                    "
                >

                    <button
                        onclick="downloadImage()"
                    >
                        ⬇️ Unduh Foto Frame
                    </button>


                    <button
                        class="outline"

                        onclick="downloadTanpaFrame()"
                    >
                        🖼️ Unduh Foto Satuan
                    </button>


                    <button
                        class="outline"

                        onclick="location.reload()"

                        style="
                            background-color:#ffebeb;
                            color:red;
                            border-color:red;
                        "
                    >
                        🔄 Sesi Baru
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           NAVIGATION
        ===================================================== */

        function nav(screenId) {

            document
                .querySelectorAll('.screen')
                .forEach(
                    screen =>
                        screen.classList.remove(
                            'active'
                        )
                );


            document
                .getElementById(screenId)
                .classList.add(
                    'active'
                );

        }



        /* =====================================================
           GLOBAL VARIABLES
        ===================================================== */

        let requiredPhotos = 0;

        let selectedFramePath = '';

        let frameHoles = [];

        let stream = null;

        let isMirrored = true;

        let capturedImages = [];

        let finalFrameImageObj = null;

        let currentCanvasFilter = 'none';

        let isTakingPhoto = false;



        /* =====================================================
           DETECT TRANSPARENT HOLES
        ===================================================== */

        async function detectFrameHoles(
            imgSrc
        ) {

            return new Promise(
                (resolve, reject) => {

                    const img =
                        new Image();


                    img.onload = () => {

                        finalFrameImageObj =
                            img;


                        const canvas =
                            document.createElement(
                                'canvas'
                            );


                        const ctx =
                            canvas.getContext(
                                '2d',
                                {
                                    willReadFrequently:
                                        true
                                }
                            );


                        const width =
                            img.width;


                        const height =
                            img.height;


                        canvas.width =
                            width;


                        canvas.height =
                            height;


                        ctx.drawImage(
                            img,
                            0,
                            0
                        );


                        const imgData =
                            ctx.getImageData(
                                0,
                                0,
                                width,
                                height
                            );


                        const data =
                            imgData.data;


                        const visited =
                            new Uint8Array(
                                width * height
                            );


                        const holes = [];


                        for (
                            let y = 0;
                            y < height;
                            y++
                        ) {

                            for (
                                let x = 0;
                                x < width;
                                x++
                            ) {

                                const index =
                                    y * width + x;


                                if (
                                    data[
                                        index * 4 + 3
                                    ] < 10 &&
                                    visited[index] === 0
                                ) {

                                    let minX = x;
                                    let maxX = x;
                                    let minY = y;
                                    let maxY = y;


                                    const stack =
                                        [index];


                                    while (
                                        stack.length > 0
                                    ) {

                                        const idx =
                                            stack.pop();


                                        if (
                                            visited[idx]
                                        )
                                            continue;


                                        const px =
                                            idx % width;


                                        const py =
                                            Math.floor(
                                                idx /
                                                width
                                            );


                                        if (
                                            data[
                                                idx * 4 + 3
                                            ] >= 10
                                        )
                                            continue;


                                        visited[idx] =
                                            1;


                                        if (
                                            px < minX
                                        )
                                            minX = px;


                                        if (
                                            px > maxX
                                        )
                                            maxX = px;


                                        if (
                                            py < minY
                                        )
                                            minY = py;


                                        if (
                                            py > maxY
                                        )
                                            maxY = py;


                                        if (
                                            px + 1 <
                                            width
                                        )
                                            stack.push(
                                                idx + 1
                                            );


                                        if (
                                            px - 1 >=
                                            0
                                        )
                                            stack.push(
                                                idx - 1
                                            );


                                        if (
                                            py + 1 <
                                            height
                                        )
                                            stack.push(
                                                idx + width
                                            );


                                        if (
                                            py - 1 >=
                                            0
                                        )
                                            stack.push(
                                                idx - width
                                            );

                                    }


                                    if (
                                        maxX - minX > 80 &&
                                        maxY - minY > 80
                                    ) {

                                        holes.push({

                                            x: minX,

                                            y: minY,

                                            w:
                                                maxX -
                                                minX,

                                            h:
                                                maxY -
                                                minY

                                        });

                                    }

                                }

                            }

                        }


                        holes.sort(
                            (a, b) => {

                                if (
                                    Math.abs(
                                        a.y -
                                        b.y
                                    ) < 20
                                ) {

                                    return (
                                        a.x -
                                        b.x
                                    );

                                }

                                return (
                                    a.y -
                                    b.y
                                );

                            }
                        );


                        resolve(
                            holes
                        );

                    };


                    img.onerror = () => {

                        reject(
                            'Gambar frame tidak ditemukan.'
                        );

                    };


                    img.src =
                        imgSrc;

                }
            );

        }



        /* =====================================================
           SELECT FRAME
        ===================================================== */

        async function selectFrame(
            element,
            framePath
        ) {

            document
                .querySelectorAll(
                    '.frame-item'
                )
                .forEach(
                    item =>
                        item.classList.remove(
                            'selected'
                        )
                );


            element.classList.add(
                'selected'
            );


            selectedFramePath =
                framePath;


            const button =
                document.getElementById(
                    'btn-continue-camera'
                );


            button.disabled =
                true;


            button.innerText =
                'Memindai Frame...';


            try {

                frameHoles =
                    await detectFrameHoles(
                        framePath
                    );


                requiredPhotos =
                    frameHoles.length;


                if (
                    requiredPhotos === 0
                ) {

                    button.innerText =
                        'Pilih Frame Dulu';


                    alert(
                        'Frame tidak memiliki lubang transparan!'
                    );


                    return;

                }


                button.disabled =
                    false;


                button.innerText =
                    `Lanjut (${requiredPhotos} Foto)`;


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    error
                );

            }

        }



        /* =====================================================
           INIT CAMERA
        ===================================================== */

        async function initCamera() {

            try {

                if (stream) {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }


                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode:
                                    'user',

                                width: {
                                    ideal:
                                        1280
                                },

                                height: {
                                    ideal:
                                        720
                                }

                            }

                        });


                const video =
                    document.getElementById(
                        'camera-feed'
                    );


                video.srcObject =
                    stream;


                capturedImages =
                    new Array(
                        requiredPhotos
                    );


                isTakingPhoto =
                    false;


                document
                    .getElementById(
                        'btn-take'
                    )
                    .disabled =
                    false;


                document
                    .getElementById(
                        'btn-next-preview'
                    )
                    .disabled =
                    true;


                setTimeout(
                    () => {

                        buildFramePreview();

                        adjustCameraRatio();

                    },
                    500
                );


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    'Izin Kamera diperlukan.'
                );

            }

        }



        /* =====================================================
           CAMERA RATIO
        ===================================================== */

        function adjustCameraRatio() {

            const videoWrapper =
                document.getElementById(
                    'video-wrapper'
                );


            if (
                !frameHoles.length
            )
                return;


            const firstHole =
                frameHoles[0];


            const ratio =
                firstHole.w /
                firstHole.h;


            videoWrapper.style.aspectRatio =
                `${ratio}`;

        }



        /* =====================================================
           BUILD FRAME PREVIEW
        ===================================================== */

        function buildFramePreview() {

            const container =
                document.getElementById(
                    'frame-preview-container'
                );


            const slots =
                document.getElementById(
                    'photo-slots'
                );


            slots.innerHTML =
                '';


            if (
                !finalFrameImageObj
            )
                return;


            const parentWidth =
                container.clientWidth;


            const parentHeight =
                container.clientHeight;


            const frameRatio =
                finalFrameImageObj.width /
                finalFrameImageObj.height;


            let frameWidth =
                parentWidth;


            let frameHeight =
                frameWidth /
                frameRatio;


            if (
                frameHeight >
                parentHeight
            ) {

                frameHeight =
                    parentHeight;


                frameWidth =
                    frameHeight *
                    frameRatio;

            }


            const left =
                (
                    parentWidth -
                    frameWidth
                ) / 2;


            const top =
                (
                    parentHeight -
                    frameHeight
                ) / 2;


            frameHoles.forEach(
                (
                    hole,
                    index
                ) => {

                    const slot =
                        document.createElement(
                            'div'
                        );


                    slot.className =
                        'photo-slot';


                    slot.style.left =
                        `${
                            left +
                            (
                                hole.x /
                                finalFrameImageObj.width
                            ) *
                            frameWidth
                        }px`;


                    slot.style.top =
                        `${
                            top +
                            (
                                hole.y /
                                finalFrameImageObj.height
                            ) *
                            frameHeight
                        }px`;


                    slot.style.width =
                        `${
                            (
                                hole.w /
                                finalFrameImageObj.width
                            ) *
                            frameWidth
                        }px`;


                    slot.style.height =
                        `${
                            (
                                hole.h /
                                finalFrameImageObj.height
                            ) *
                            frameHeight
                        }px`;


                    slot.dataset.index =
                        index;


                    const canvas =
                        document.createElement(
                            'canvas'
                        );


                    canvas.width =
                        hole.w;


                    canvas.height =
                        hole.h;


                    slot.appendChild(
                        canvas
                    );


                    const number =
                        document.createElement(
                            'div'
                        );


                    number.className =
                        'slot-number';


                    number.innerText =
                        index + 1;


                    slot.appendChild(
                        number
                    );


                    const empty =
                        document.createElement(
                            'div'
                        );


                    empty.className =
                        'slot-empty';


                    empty.innerHTML =
                        `Foto ${index + 1}<br>Belum diambil`;


                    slot.appendChild(
                        empty
                    );


                    const retake =
                        document.createElement(
                            'div'
                        );


                    retake.className =
                        'retake-label';


                    retake.innerHTML =
                        '↻ Ambil Ulang';


                    slot.appendChild(
                        retake
                    );


                    /*
                     * PENTING:
                     * Klik langsung pada slot
                     */

                    slot.addEventListener(
                        'click',
                        function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            /*
                             * Hanya bisa retake
                             * jika foto sudah ada
                             */

                            if (
                                capturedImages[index]
                            ) {

                                retakePhoto(
                                    index
                                );

                            }

                        }
                    );


                    slots.appendChild(
                        slot
                    );


                    renderSlot(
                        index
                    );

                }
            );


            /*
             * Frame berada paling atas
             */

            const frame =
                document.getElementById(
                    'camera-side-frame'
                );


            frame.src =
                selectedFramePath;


            frame.style.width =
                `${frameWidth}px`;


            frame.style.height =
                `${frameHeight}px`;

        }



        /* =====================================================
           RENDER PHOTO SLOT
        ===================================================== */

        function renderSlot(
            index
        ) {

            const slots =
                document.querySelectorAll(
                    '.photo-slot'
                );


            const slot =
                slots[index];


            if (!slot)
                return;


            const canvas =
                slot.querySelector(
                    'canvas'
                );


            const ctx =
                canvas.getContext(
                    '2d'
                );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * FOTO BELUM ADA
             */

            if (
                !capturedImages[index]
            ) {

                ctx.fillStyle =
                    '#222';


                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                slot.classList.remove(
                    'has-photo'
                );


                return;

            }


            slot.classList.add(
                'has-photo'
            );


            const img =
                new Image();


            img.onload =
                () => {

                    drawImageIntoHole(

                        ctx,

                        img,

                        {
                            x: 0,

                            y: 0,

                            w: canvas.width,

                            h: canvas.height
                        }

                    );

                };


            img.src =
                capturedImages[index];


            const empty =
                slot.querySelector(
                    '.slot-empty'
                );


            if (empty) {

                empty.style.display =
                    'none';

            }

        }



        /* =====================================================
           DRAW IMAGE TO SLOT
        ===================================================== */

        function drawImageIntoHole(
            ctx,
            img,
            target
        ) {

            const imageRatio =
                img.width /
                img.height;


            const targetRatio =
                target.w /
                target.h;


            let sourceWidth =
                img.width;


            let sourceHeight =
                img.height;


            let sourceX =
                0;


            let sourceY =
                0;


            if (
                imageRatio >
                targetRatio
            ) {

                sourceWidth =
                    img.height *
                    targetRatio;


                sourceX =
                    (
                        img.width -
                        sourceWidth
                    ) / 2;

            } else {

                sourceHeight =
                    img.width /
                    targetRatio;


                sourceY =
                    (
                        img.height -
                        sourceHeight
                    ) / 2;

            }


            ctx.drawImage(

                img,

                sourceX,

                sourceY,

                sourceWidth,

                sourceHeight,

                target.x,

                target.y,

                target.w,

                target.h

            );

        }



        /* =====================================================
           MIRROR
        ===================================================== */

        function toggleMirror() {

            isMirrored =
                !isMirrored;


            document
                .getElementById(
                    'camera-feed'
                )
                .style.transform =
                isMirrored
                    ? 'scaleX(-1)'
                    : 'scaleX(1)';

        }



        /* =====================================================
           TAKE ALL PHOTOS
        ===================================================== */

        async function takePhotos() {

            if (
                isTakingPhoto
            )
                return;


            if (
                !stream
            )
                return;


            isTakingPhoto =
                true;


            const takeButton =
                document.getElementById(
                    'btn-take'
                );


            takeButton.disabled =
                true;


            /*
             * Ambil semua lubang
             */

            for (
                let i = 0;
                i < requiredPhotos;
                i++
            ) {

                await runCountdown();


                captureFrame(
                    i
                );

            }


            isTakingPhoto =
                false;


            /*
             * Lanjutkan aktif
             */

            document
                .getElementById(
                    'btn-next-preview'
                )
                .disabled =
                false;


            /*
             * Tombol Ambil Foto
             * bisa digunakan lagi
             */

            takeButton.disabled =
                false;

        }



        /* =====================================================
           RETAKE FOTO TERTENTU
        ===================================================== */

        async function retakePhoto(
            index
        ) {

            /*
             * Jangan izinkan jika
             * kamera sedang mengambil foto
             */

            if (
                isTakingPhoto
            )
                return;


            if (
                !stream
            )
                return;


            /*
             * Pastikan index valid
             */

            if (
                index < 0 ||
                index >= requiredPhotos
            )
                return;


            isTakingPhoto =
                true;


            /*
             * Nonaktifkan klik slot
             * selama countdown
             */

            const slots =
                document.querySelectorAll(
                    '.photo-slot'
                );


            slots.forEach(
                slot => {

                    slot.style.pointerEvents =
                        'none';

                }
            );


            /*
             * Countdown khusus foto
             */

            await runCountdown();


            /*
             * Ambil ulang foto
             */

            captureFrame(
                index
            );


            /*
             * Aktifkan kembali slot
             */

            slots.forEach(
                slot => {

                    slot.style.pointerEvents =
                        'auto';

                }
            );


            isTakingPhoto =
                false;


            /*
             * Lanjutkan tetap aktif
             */

            document
                .getElementById(
                    'btn-next-preview'
                )
                .disabled =
                false;

        }



        /* =====================================================
           COUNTDOWN
        ===================================================== */

        function runCountdown() {

            return new Promise(
                resolve => {

                    let count =
                        3;


                    const countdown =
                        document.getElementById(
                            'countdown'
                        );


                    countdown.innerText =
                        count;


                    const interval =
                        setInterval(
                            () => {

                                count--;


                                if (
                                    count > 0
                                ) {

                                    countdown.innerText =
                                        count;

                                } else {

                                    clearInterval(
                                        interval
                                    );


                                    countdown.innerText =
                                        '';


                                    const flash =
                                        document.getElementById(
                                            'flash'
                                        );


                                    flash.classList.add(
                                        'active'
                                    );


                                    setTimeout(
                                        () => {

                                            flash.classList.remove(
                                                'active'
                                            );

                                        },
                                        120
                                    );


                                    resolve();

                                }

                            },
                            700
                        );

                }
            );

        }



        /* =====================================================
           CAPTURE FRAME
        ===================================================== */

        function captureFrame(
            index
        ) {

            const video =
                document.getElementById(
                    'camera-feed'
                );


            if (
                !video.videoWidth ||
                !video.videoHeight
            )
                return;


            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            const ctx =
                canvas.getContext(
                    '2d'
                );


            /*
             * Mirror mengikuti
             * tampilan kamera
             */

            if (
                isMirrored
            ) {

                ctx.translate(
                    canvas.width,
                    0
                );


                ctx.scale(
                    -1,
                    1
                );

            }


            ctx.drawImage(
                video,
                0,
                0
            );


            /*
             * Simpan hasil foto
             */

            capturedImages[index] =
                canvas.toDataURL(
                    'image/jpeg',
                    0.92
                );


            /*
             * Update tampilan slot
             */

            renderSlot(
                index
            );

        }



        /* =====================================================
           LOAD PREVIEW
        ===================================================== */

        function loadPreview() {

            if (
                stream
            ) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                stream =
                    null;

            }


            drawCanvas(
                true,
                'result-canvas'
            );

        }



        /* =====================================================
           FILTER
        ===================================================== */

        function applyFilter(
            filterCss
        ) {

            currentCanvasFilter =
                filterCss;


            drawCanvas(
                true,
                'result-canvas'
            );

        }



        /* =====================================================
           DRAW FINAL CANVAS
        ===================================================== */

        async function drawCanvas(
            withFrame = true,
            canvasId = 'result-canvas'
        ) {

            const canvas =
                document.getElementById(
                    canvasId
                );


            const ctx =
                canvas.getContext(
                    '2d'
                );


            canvas.width =
                finalFrameImageObj.width;


            canvas.height =
                finalFrameImageObj.height;


            ctx.fillStyle =
                '#FFFFFF';


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.filter =
                currentCanvasFilter;


            const promises =
                capturedImages.map(
                    (
                        source,
                        index
                    ) => {

                        return new Promise(
                            resolve => {

                                if (
                                    !source
                                ) {

                                    resolve();

                                    return;

                                }


                                const img =
                                    new Image();


                                img.onload =
                                    () => {

                                        drawImageIntoHole(

                                            ctx,

                                            img,

                                            frameHoles[
                                                index
                                            ]

                                        );


                                        resolve();

                                    };


                                img.onerror =
                                    () => {

                                        resolve();

                                    };


                                img.src =
                                    source;

                            }
                        );

                    }
                );


            await Promise.all(
                promises
            );


            /*
             * Frame paling atas
             */

            if (
                withFrame
            ) {

                ctx.filter =
                    'none';


                ctx.drawImage(

                    finalFrameImageObj,

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );

            }

        }



        /* =====================================================
           DOWNLOAD FINAL
        ===================================================== */

        function downloadImage() {

            const link =
                document.createElement(
                    'a'
                );


            link.download =
                `photobooth_frame_${Date.now()}.png`;


            link.href =
                document
                    .getElementById(
                        'result-canvas'
                    )
                    .toDataURL(
                        'image/png'
                    );


            link.click();

        }



        /* =====================================================
           DOWNLOAD FOTO SATUAN
        ===================================================== */

        function downloadTanpaFrame() {

            capturedImages.forEach(
                (
                    image,
                    index
                ) => {

                    if (
                        !image
                    )
                        return;


                    const link =
                        document.createElement(
                            'a'
                        );


                    link.download =
                        `foto_satuan_${index + 1}_${Date.now()}.png`;


                    link.href =
                        image;


                    link.click();

                }
            );

        }



        /* =====================================================
           UPLOAD SESSION
        ===================================================== */

        async function processAndUploadSession() {

            nav(
                'result-screen'
            );


            await drawCanvas(
                true,
                'final-preview-canvas'
            );


            await drawCanvas(
                true,
                'result-canvas'
            );


            const frameImageData =
                document
                    .getElementById(
                        'result-canvas'
                    )
                    .toDataURL(
                        'image/png'
                    );


            gifshot.createGIF(

                {

                    images: [
                        ...capturedImages,
                        frameImageData
                    ],

                    interval:
                        0.6,

                    gifWidth:
                        600,

                    gifHeight:
                        Math.floor(
                            600 *
                            (
                                finalFrameImageObj.height /
                                finalFrameImageObj.width
                            )
                        ),

                    numFrames:
                        capturedImages.length +
                        1

                },

                async function(obj) {

                    let gifData =
                        '';


                    if (
                        !obj.error
                    ) {

                        gifData =
                            obj.image;

                    }


                    try {

                        const response =
                            await fetch(
                                '/upload-session',
                                {

                                    method:
                                        'POST',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            frameImage:
                                                frameImageData,

                                            individualImages:
                                                capturedImages,

                                            gifImage:
                                                gifData

                                        })

                                }
                            );


                        const result =
                            await response.json();


                        if (
                            result.success
                        ) {

                            const qrContainer =
                                document.getElementById(
                                    'qrcode-container'
                                );


                            qrContainer.innerHTML =
                                '';


                            new QRCode(

                                qrContainer,

                                {

                                    text:
                                        result.folder_link,

                                    width:
                                        170,

                                    height:
                                        170,

                                    colorDark:
                                        '#000000',

                                    colorLight:
                                        '#ffffff',

                                    correctLevel:
                                        QRCode
                                            .CorrectLevel
                                            .H

                                }

                            );


                            document
                                .getElementById(
                                    'qr-status-text'
                                )
                                .innerText =
                                'Scan untuk unduh folder sesi!';

                        } else {

                            alert(
                                'Gagal membuat folder di Drive.'
                            );

                        }

                    } catch (error) {

                        console.error(
                            'Error:',
                            error
                        );


                        alert(
                            'Gagal menghubungi server Node.js.'
                        );

                    }

                }

            );

        }



        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            'resize',
            () => {

                const cameraScreen =
                    document.getElementById(
                        'camera-screen'
                    );


                if (
                    cameraScreen.classList.contains(
                        'active'
                    )
                ) {

                    buildFramePreview();

                    adjustCameraRatio();

                }

            }
        );

    </script>

</body>
